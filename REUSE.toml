version = 1

SPDX-PackageName = "lockbox-k8s-controller"
SPDX-PackageSupplier = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-PackageDownloadLocation = "https://gitlab.cherkaoui.ch/HadiCherkaoui/lockbox-k8s-controller"

# Files that cannot carry an inline SPDX header without changing behaviour.
# Everything else is annotated in-file by `reuse annotate`.
#
# Copyright notices carry no year on purpose: REUSE makes it optional, copyright
# attaches automatically under Berne, and a year nobody updates becomes a false
# claim rather than a useful fact. Git history is the record.

# The root LICENSE is a verbatim copy of LICENSES/AGPL-3.0-or-later.txt, kept
# because that is where GitLab and GitHub detect the licence. The text is the
# FSF's, not ours -- `override` stops the 2007 FSF line inside it being reported
# as this file's copyright.
[[annotations]]
path = "LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# cmd/main.go still carries kubebuilder's scaffold header verbatim -- an
# Apache-2.0 grant whose `Copyright 2026.` placeholder names no holder. That
# prose block is left in the file untouched; `reuse annotate` would have kept
# only the bare copyright line and DELETED the grant text around it. The file is
# scaffold plus our own additions, so it is genuinely under both licences and
# both holders are named.
[[annotations]]
path = "cmd/main.go"
precedence = "override"
SPDX-FileCopyrightText = [
  "The Kubernetes Authors",
  "Hadi Cherkaoui <contact@hide.cherkaoui.ch>",
]
SPDX-License-Identifier = "Apache-2.0 AND AGPL-3.0-or-later"

[[annotations]]
path = ["go.sum", "PROJECT"]
SPDX-FileCopyrightText = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Regenerated by `make manifests` (controller-gen); a header would be wiped.
[[annotations]]
path = "config/rbac/role.yaml"
SPDX-FileCopyrightText = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Helm templates render into deployed manifests. All ten are guarded by
# {{- if -}} or are template helpers, so a leading '#' comment would render as a
# comment-only document when the feature is disabled. .tpl is unknown to reuse.
[[annotations]]
path = "deploy/templates/**"
SPDX-FileCopyrightText = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# JSON has no comment syntax.
[[annotations]]
path = ".devcontainer/devcontainer.json"
SPDX-FileCopyrightText = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
