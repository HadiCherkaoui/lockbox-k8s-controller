sonar.projectKey=HadiCherkaoui_lockbox-k8s-controller_d03cd40b-0f4b-4321-bab3-a4a5cd8c83d8
sonar.qualitygate.wait=true

# Source / test separation. Without this SonarQube treats *_test.go as
# production code, drags coverage stats down (tests have ~0% coverage of
# themselves), and tries to lint the Helm YAML which isn't Go.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,deploy/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage report produced by `make test` (-coverprofile cover.out) and
# passed in from the `test` CI job's artifact.
sonar.go.coverage.reportPaths=cover.out
# cmd/main.go is the controller-runtime wiring entry point; intentionally
# not unit-tested. Excluding it keeps the new-code coverage gate honest
# instead of grading us on code we don't intend to test.
sonar.coverage.exclusions=cmd/**/*

# Go test convention uses Test<Subject>_<Scenario> (underscore-delimited) —
# see the stdlib, e.g. TestParse_Empty. SonarQube's default Go naming rule
# (go:S100) enforces ^(_|[a-zA-Z0-9]+)$ which forbids the underscore.
# Exclude only test files; production code still gets the check.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
