sonar.qualitygate.wait=true

# Go test convention uses Test<Subject>_<Scenario> (underscore-delimited) —
# see the stdlib, e.g. TestParse_Empty. SonarQube's default Go naming rule
# (go:S100) enforces ^(_|[a-zA-Z0-9]+)$ which forbids the underscore.
# Exclude only test files; production code still gets the check.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
