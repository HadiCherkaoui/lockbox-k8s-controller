spec:
  inputs:
    image_tag:
      default: "latest"
      description: "Docker image tag (e.g. 1.0.0, latest)"
---

variables:
  GO_VERSION: "1.25" # Matching the version from go.mod (1.25.3)
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go mod tidy
    - make test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

test-e2e:
  stage: test
  image: golang:${GO_VERSION}
  services:
    - name: docker:28.0.4-dind
      alias: docker
      command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    CERT_MANAGER_INSTALL_SKIP: "true"
  before_script:
    - apt-get update && apt-get install -y docker.io
    - curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
    - chmod +x ./kind && mv ./kind /usr/local/bin/kind
    - kind version
    - curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/$(go env GOARCH)/kubectl"
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - kubectl version --client
  script:
    - go mod tidy
    - make test-e2e

# -------------------------
# Build and push image
# -------------------------
.build_docker_common:
  image: docker:28.0.4
  services:
    - name: docker:28.0.4-dind
      alias: docker
      command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:image:
  stage: build
  needs: ["test"]
  extends: .build_docker_common
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$[[ inputs.image_tag ]]" .
    - docker push "$CI_REGISTRY_IMAGE:$[[ inputs.image_tag ]]"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - Dockerfile
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# -------------------------
# Sonar
# -------------------------
build-sonar:
  stage: lint
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
