spec:
  inputs:
    image_tag:
      default: "latest"
      description: "Docker image tag (e.g. 1.0.0, latest)"
---

variables:
  GO_VERSION: "1.25" # Matching the version from go.mod (1.25.3)
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - lint
  - test
  - quality
  - build
  - publish

lint:
  stage: lint
  # Pinned to match the Makefile-installed version. Bump intentionally —
  # `:latest` silently introduces new rules that pass locally but break CI.
  image: golangci/golangci-lint:v2.7.2
  script:
    - golangci-lint run

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go mod tidy
    - make test
  # cover.out is the file `make test` writes (`-coverprofile cover.out`);
  # SonarQube picks it up via sonar.go.coverage.reportPaths.
  artifacts:
    when: always
    expire_in: 1 hour
    paths:
      - cover.out
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'


# -------------------------
# Build and push image
# -------------------------
.build_docker_common:
  image: docker:28.0.4
  services:
    - name: docker:28.0.4-dind
      alias: docker
      command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:image:
  stage: build
  needs: ["test"]
  extends: .build_docker_common
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$[[ inputs.image_tag ]]" .
    - docker push "$CI_REGISTRY_IMAGE:$[[ inputs.image_tag ]]"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - Dockerfile
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# -------------------------
# Publish Helm chart as OCI artifact
# -------------------------
# Mirrors anvil's pattern: package deploy/ and push to the project's
# container registry as an OCI chart. Flux's HelmRepository (kind: oci)
# can then pull it without a git source.
# Chart version comes from deploy/Chart.yaml — bump that field on each release.
helm-publish:
  stage: publish
  image: alpine/helm:3
  before_script:
    - helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - set -euo pipefail
    - helm package deploy/ --destination /tmp/
    - helm push /tmp/lockbox-k8s-controller-*.tgz "oci://$CI_REGISTRY_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - deploy/**/*
        - .gitlab-ci.yml

# -------------------------
# Sonar
# -------------------------
build-sonar:
  # Runs in a dedicated stage AFTER `test` so it can consume cover.out via
  # the test job's artifact. Was in `lint` before; that ran before test and
  # the scanner saw 0% coverage on new code, tripping the quality gate.
  stage: quality
  needs:
    - job: test
      artifacts: true
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
