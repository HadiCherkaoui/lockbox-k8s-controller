{{- if .Values.rbac.create -}}
{{- /* Cluster-scoped CRUD on Secrets: the syncer writes into whatever
       namespaces the Lockbox events name. There is no namespace allowlist
       in the controller — every event is honoured. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lockbox.fullname" . }}
  labels:
    {{- include "lockbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end -}}
