{{- include "lockbox.requireEndpoint" . -}}
{{- include "lockbox.requireBootstrap" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lockbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lockbox.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lockbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lockbox.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ include "lockbox.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "lockbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- end }}
          env:
            # Downward API: the controller stores its keypair Secret in this
            # namespace. Reading from the env (instead of only the SA token
            # file) keeps things working on clusters with
            # `automountServiceAccountToken: false`.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOCKBOX_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "lockbox.configSecretName" . }}
                  key: endpoint
            - name: LOCKBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lockbox.configSecretName" . }}
                  key: api-key
                  # Only needed for the first start; the controller persists
                  # the Ed25519 seed in lockbox-credentials after registration.
                  optional: true
            - name: LOCKBOX_SYNC_INTERVAL
              value: {{ .Values.lockbox.syncInterval | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
