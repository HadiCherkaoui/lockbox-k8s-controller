{{- include "lockbox.requireEndpoint" . -}}
{{- include "lockbox.requireBootstrap" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lockbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lockbox.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lockbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lockbox.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ include "lockbox.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "lockbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- if .Values.metrics.certSecret }}
            - --metrics-cert-path=/etc/lockbox/metrics-certs
            {{- end }}
            {{- end }}
          env:
            # Downward API: the controller stores its keypair Secret in this
            # namespace. Reading from the env (instead of only the SA token
            # file) keeps things working on clusters with
            # `automountServiceAccountToken: false`.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOCKBOX_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "lockbox.configSecretName" . }}
                  key: endpoint
            - name: LOCKBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lockbox.configSecretName" . }}
                  key: api-key
                  # Only needed for the first start; the controller persists
                  # the Ed25519 seed in lockbox-credentials after registration.
                  optional: true
            - name: LOCKBOX_SYNC_INTERVAL
              value: {{ .Values.lockbox.syncInterval | quote }}
            # Namespaces the syncer refuses to write to, checked before any
            # ciphertext is decrypted. Open by default so a new namespace needs
            # no config change; this list is what keeps an upstream event out of
            # the namespaces where a Secret write is a cluster takeover.
            - name: LOCKBOX_DENIED_NAMESPACES
              value: {{ join "," .Values.lockbox.deniedNamespaces | quote }}
            {{- with .Values.lockbox.allowedNamespaces }}
            # Set: switches the check to a strict allowlist.
            - name: LOCKBOX_ALLOWED_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            # Requires every ciphertext to authenticate against the AAD binding
            # it to its namespace, name, field and timestamp. Needs a Lockbox
            # server that seals with the same construction.
            - name: LOCKBOX_REQUIRE_AAD
              value: {{ .Values.lockbox.requireAAD | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if and .Values.metrics.enabled .Values.metrics.certSecret }}
          volumeMounts:
            - name: metrics-certs
              mountPath: /etc/lockbox/metrics-certs
              readOnly: true
          {{- end }}
      {{- if and .Values.metrics.enabled .Values.metrics.certSecret }}
      volumes:
        - name: metrics-certs
          secret:
            secretName: {{ .Values.metrics.certSecret }}
            defaultMode: 0400
      {{- end }}
